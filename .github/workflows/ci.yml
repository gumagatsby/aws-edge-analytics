name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test edge/edge.test.mjs

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # type-checks first

  python:
    name: api, pipeline and Spark transforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # the Glue 5.0 runtime
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pip install pytest==8.4.2 pyspark==3.5.4 boto3
      - run: pytest -q api
      - run: pytest -q pipeline
      - run: pytest -q glue/tests
      - name: Synthetic generator runs and its output parses
        run: python traffic/synthetic.py --start 2026-10-10 --days 1 --visitors-per-day 300 --out out

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          config_file: terraform/.checkov.yml
