# Runs the deployed CloudFront Functions in CloudFront's own test runtime. Uses OIDC:
# GitHub exchanges a short-lived token for a read-only role; no AWS keys are stored.
name: edge-runtime

# The CI role's ARN (terraform output ci_role_arn) is a repository secret, so the account
# ID does not appear on the public run page.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - name: New visitor on the homepage gets a group and a rewrite
        run: |
          etag=$(aws cloudfront describe-function --name edge-analytics-viewer-request --stage LIVE --query ETag --output text)
          aws cloudfront test-function --name edge-analytics-viewer-request --if-match "$etag" --stage LIVE \
            --event-object fileb://edge/events/new-visitor.json --query 'TestResult' > out.json
          cat out.json
          python3 - <<'PY'
          import json
          r = json.load(open("out.json"))
          assert not r.get("FunctionErrorMessage"), r
          out = json.loads(r["FunctionOutput"])["request"]
          assert out["uri"] in ("/index.html", "/variants/b/index.html"), out["uri"]
          assert "utm_source" not in out["querystring"], out["querystring"]
          print("ok:", out["uri"], "compute utilisation", r["ComputeUtilization"])
          PY
